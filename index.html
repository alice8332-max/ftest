<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>投资管理平台</title>
<style>
:root{
  --bg:#f5f6f8;
  --card:#ffffff;
  --card2:#eef0f4;
  --line:#e2e5ea;
  --text:#1f2430;
  --muted:#7a8291;
  --up:#f44336;
  --down:#4caf50;
  --accent:#2f6fed;
  --warn:#f57c00;
  /* 定投参考档位色（独立命名空间，不与行情涨跌语义混用） */
  --lv-green:#2e7d32;   /* 2X */
  --lv-lgreen:#558b2f;  /* 1.5X */
  --lv-neutral:#607d8b; /* 1X */
  --lv-orange:#f57c00;  /* 0X暂停 */
  --lv-red:#c62828;     /* 0X止盈 */
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.5;
  padding:20px 28px 64px;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9cdd6;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
.num{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
.app{max-width:1280px;margin:0 auto}
.topbar{display:flex;align-items:center}
.topbar h1{font-size:20px;font-weight:700}
.topbar-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
.topbar select{
  background:#fff;border:1px solid #d5d9e0;border-radius:6px;
  color:var(--text);padding:6px 10px;font-size:13px;cursor:pointer;
}
.topbar select:focus{outline:none;border-color:var(--accent)}
.btn{
  border:1px solid #d5d9e0;background:#fff;color:var(--text);
  padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;
  transition:filter .15s,background .15s,border-color .15s;
}
.btn:hover{filter:brightness(.94)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--up);border-color:var(--up);color:#fff}
.btn.ghost{background:transparent}
.btn.chip{padding:4px 10px;font-size:12px}
.btn.chip.buy{color:var(--up);border-color:rgba(244,67,54,.45);background:rgba(244,67,54,.05)}
.btn.chip.sell{color:var(--down);border-color:rgba(76,175,80,.45);background:rgba(76,175,80,.05)}
.btn.buy-solid{background:var(--up);border-color:var(--up);color:#fff}
.btn.sell-solid{background:var(--down);border-color:var(--down);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0 20px}
.sum-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.sum-lbl{font-size:13px;color:var(--muted);margin-bottom:6px}
.sum-val{font-size:26px;font-weight:700}
.sum-pct{font-size:15px;font-weight:400;opacity:.85}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{
  background:none;border:none;color:var(--muted);font-size:14px;
  padding:10px 18px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.view{display:none}
.view.active{display:block}
.section-head,.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.section-head h2{font-size:16px;font-weight:600}
.grow{flex:1}
.switch{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
.tool-label{color:var(--muted);font-size:13px}
.toolbar select{
  background:#fff;border:1px solid #d5d9e0;border-radius:6px;
  color:var(--text);padding:6px 10px;font-size:13px;
}
.holding{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  margin-bottom:14px;position:relative;transition:opacity .2s;
  box-shadow:0 1px 3px rgba(16,24,40,.05);
}
.holding.cleared{opacity:.55}
.holding[draggable]{cursor:grab}
.holding.dragging{opacity:.35}
.holding.drop-hint{box-shadow:inset 0 3px 0 var(--warn)}
.holding-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.holding-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600}
.idx{color:var(--muted);font-size:13px;font-weight:400;width:20px;text-align:right}
.code{font-size:14px;color:var(--text)}
.badge-cleared{background:#eceff3;color:var(--muted);font-size:11px;padding:2px 8px;border-radius:4px;font-weight:400}
.holding-update{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.holding-actions{display:flex;gap:8px}
.holding-body{display:flex;flex-wrap:wrap;gap:10px 40px;padding:14px 16px}
.stat .lbl{font-size:12px;color:var(--muted);margin-bottom:3px;white-space:nowrap}
.stat .val{font-size:15px;white-space:nowrap}
.up{color:var(--up)}
.down{color:var(--down)}
.empty{
  color:var(--muted);text-align:center;padding:52px 0;
  background:var(--card);border:1px dashed #cfd4dc;border-radius:10px;
}
.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.tx-table{width:100%;border-collapse:collapse;min-width:960px}
.tx-table th{
  padding:10px 12px;font-size:12px;color:var(--muted);text-align:left;
  border-bottom:1px solid var(--line);white-space:nowrap;font-weight:normal;
  position:sticky;top:0;background:var(--card);
}
.tx-table td{padding:9px 12px;border-bottom:1px solid #eef0f4;font-size:13px;white-space:nowrap}
.tx-table tbody tr:hover{background:#f6f8fb}
.tx-table tr:last-child td{border-bottom:none}
.empty-row td{text-align:center;color:var(--muted);padding:40px 0}
.note-cell{max-width:280px;overflow:hidden;text-overflow:ellipsis}
.row-actions{display:flex;gap:10px}
.link-del{color:var(--muted);cursor:pointer;font-size:12px;user-select:none}
.link-del:hover{color:var(--up)}
.link-edit{color:var(--muted);cursor:pointer;font-size:12px;user-select:none}
.link-edit:hover{color:var(--accent)}
.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.45);
  display:flex;align-items:center;justify-content:center;z-index:100;
}
.modal{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  width:min(600px,94vw);max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 12px 40px rgba(16,24,40,.18);
}
.modal.wide{width:min(780px,96vw)}
.modal-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-title{font-size:15px;font-weight:600}
.modal-close{
  margin-left:auto;background:none;border:none;color:var(--muted);
  font-size:20px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:4px;
}
.modal-close:hover{color:var(--text);background:var(--card2)}
.modal-body{padding:16px 18px;overflow:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form-item label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.form-item input,.form-item select{
  width:100%;background:#fff;border:1px solid #d5d9e0;border-radius:6px;
  color:var(--text);padding:8px 10px;font-size:13px;font-family:inherit;
}
.form-item input[type="date"]{color-scheme:light;cursor:pointer}
.form-item input:focus,.form-item select:focus,.toolbar select:focus{outline:none;border-color:var(--accent)}
.form-item input[readonly],.form-item input:disabled{color:var(--muted);background:#f3f4f7}
.span2{grid-column:1/-1}
.err{color:var(--up);font-size:12px;margin-top:10px;min-height:16px}
.hint{font-size:12px;color:var(--muted);margin-bottom:12px}
.muted{color:var(--muted)}
.tag-fund{
  font-size:11px;color:var(--warn);border:1px solid rgba(245,124,0,.45);
  background:rgba(245,124,0,.06);border-radius:4px;padding:1px 6px;margin-left:6px;
}
.batch-table{width:100%;border-collapse:collapse}
.batch-table th{
  font-size:12px;color:var(--muted);text-align:left;padding:7px 8px;
  border-bottom:1px solid var(--line);font-weight:normal;white-space:nowrap;
}
.batch-table td{padding:7px 8px;border-bottom:1px solid #eef0f4;white-space:nowrap}
.batch-table tr:last-child td{border-bottom:none}
.batch-table input{
  width:130px;background:#fff;border:1px solid #d5d9e0;border-radius:6px;
  color:var(--text);padding:7px 9px;font-size:13px;
}
.batch-table input:focus{outline:none;border-color:var(--accent)}
.confirm-msg{font-size:14px;line-height:1.8}
.plan-section{margin-bottom:18px}
.plan-head{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,24,40,.05);
  font-size:13px;
}
.ph-total{font-size:14px;font-weight:700}
.plan-cards{display:flex;flex-wrap:wrap;gap:12px}
.plan-card{
  flex:1 1 190px;min-width:190px;max-width:300px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;box-shadow:0 1px 3px rgba(16,24,40,.05);
}
.pc-head{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;margin-bottom:8px}
.pc-pl{font-size:16px;font-weight:700;margin-bottom:6px;min-height:24px}
.pc-gap{font-size:13px;font-weight:600;margin-bottom:2px;min-height:18px}
.pc-gap.lag{color:var(--warn)}
.pc-gap.ahead{color:var(--muted)}
.pbar{position:relative;height:14px;background:#e8ebf0;border:1px solid #dde1e8;border-radius:7px;margin-top:10px}
.pbar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:7px}
.pbar-lag{position:absolute;top:0;bottom:0;background:var(--warn);border-radius:0 4px 4px 0}
.pbar-marker{position:absolute;top:-4px;bottom:-4px;width:2px;background:#39414e;border-radius:1px;z-index:2}
.alloc-summary{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(16,24,40,.05);
  font-size:13px;color:var(--muted);
}
.alloc-list{display:flex;flex-direction:column;gap:10px}
.alloc-row{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;
  box-shadow:0 1px 3px rgba(16,24,40,.05);
}
.alloc-row.over{background:#fdf3f0;border-color:#f0cfc3}
.alloc-name{width:200px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;flex-wrap:wrap}
.alloc-bars{flex:1;min-width:300px;display:flex;flex-direction:column;gap:5px}
.alloc-line{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.alloc-line .lbl{width:140px;text-align:right;white-space:nowrap}
.abar{position:relative;flex:1;height:11px;background:#eef0f4;border-radius:6px}
.abar-t{position:absolute;left:0;top:0;bottom:0;background:#b9c0cc;border-radius:6px}
.abar-a{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px}
.alloc-nums{width:250px;font-size:13px;text-align:right}
.tag-warn{
  font-size:11px;color:var(--warn);border:1px solid rgba(245,124,0,.45);
  background:rgba(245,124,0,.06);border-radius:4px;padding:1px 6px;font-weight:400;
}
#toast{
  position:fixed;left:50%;bottom:36px;transform:translateX(-50%);
  background:#333a48;color:#fff;padding:9px 20px;border-radius:8px;
  font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:300;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
}
#toast.show{opacity:1}
.sync-dot{
  width:9px;height:9px;border-radius:50%;background:#c3c9d4;
  display:inline-block;flex:none;align-self:center;cursor:default;
}
.sync-dot.ok{background:var(--down)}
.sync-dot.pending{background:var(--warn)}
.sync-dot.err{background:var(--up)}
#bootOverlay,#loginOverlay{
  position:fixed;inset:0;background:var(--bg);z-index:400;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.login-card{
  width:100%;max-width:360px;background:#fff;border-radius:14px;
  padding:28px 24px;box-shadow:0 8px 30px rgba(16,24,40,.12);
}
/* ===== 定投参考（v0.9.0）===== */
.mon-card{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(16,24,40,.05);
}
.mon-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mon-title{font-size:15px;font-weight:600}
.mon-title .muted{font-weight:400;font-size:12px;margin-left:6px}
.mon-verdict{display:flex;align-items:center;gap:12px;padding:8px 0 10px;flex-wrap:wrap}
.lv-badge{
  display:inline-block;font-size:20px;font-weight:700;color:#fff;
  border-radius:8px;padding:4px 16px;letter-spacing:.5px;
}
.lv-green{background:var(--lv-green)}
.lv-lgreen{background:var(--lv-lgreen)}
.lv-neutral{background:var(--lv-neutral)}
.lv-orange{background:var(--lv-orange)}
.lv-red{background:var(--lv-red)}
.lv-gray{background:#9aa1ac}
.mult-note{font-size:13px;color:var(--muted);font-weight:600}
.mon-table{width:100%;border-collapse:collapse;font-size:13px}
.mon-table td{padding:5px 6px;border-top:1px dashed var(--line)}
.mon-table td:first-child{color:var(--muted);width:38%}
.mon-table .val{font-weight:600;text-align:right;width:26%}
.mon-table .asof{color:var(--muted);font-size:11px;text-align:right}
.stale{opacity:.45}
.mon-reason{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);line-height:1.7}
.src-note{font-size:11px;color:#a0a6b0;margin:6px 2px 0;line-height:1.7}
.mon-empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}

/* ===== 手机端适配（v0.8.0）：≤768px 启用，桌面样式零改动 ===== */
@media (max-width:768px){
  body{padding:12px 12px 48px;font-size:15px}
  .topbar{flex-wrap:wrap}
  .topbar h1{width:100%;margin-bottom:8px}
  .topbar-actions{width:100%;margin-left:0;flex-wrap:wrap;gap:8px}
  #btnExportJson,#btnImportJson{display:none}
  .btn{padding:9px 14px;font-size:14px}
  .btn.chip{padding:7px 12px;font-size:13px}
  .summary{grid-template-columns:1fr;gap:10px;margin:14px 0}
  .sum-card:nth-child(-n+2){display:none}
  .tabs{gap:0}
  .tab{flex:1;text-align:center;padding:12px 0;font-size:15px}
  .plan-head{display:none}
  .plan-cards{gap:10px}
  .plan-card{flex:1 1 150px;min-width:150px;max-width:none}
  .holding-head{gap:8px;padding:10px 12px}
  .holding-actions [data-act="edit"]{display:none}
  .holding:not(.fund) .holding-body{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;padding:12px}
  .holding:not(.fund) .stat:nth-child(1){display:none}
  .holding:not(.fund) .stat:nth-child(2){grid-area:1/1}
  .holding:not(.fund) .stat:nth-child(3){grid-area:1/2}
  .holding:not(.fund) .stat:nth-child(6){grid-area:1/3}
  .holding:not(.fund) .stat:nth-child(7){grid-area:1/4}
  .holding:not(.fund) .stat:nth-child(4){grid-area:2/1/3/3}
  .holding:not(.fund) .stat:nth-child(5){grid-area:2/3/3/5}
  .holding.fund .holding-body{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;padding:12px}
  .holding{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .toolbar{flex-wrap:wrap}
  .toolbar .tool-label:first-of-type,
  #sortDate,#sortCode,#btnExportCsv{display:none}
  #txFilter{flex:1;max-width:240px;font-size:16px}
  .tx-table{min-width:0}
  .tx-table th:nth-child(3),.tx-table td:nth-child(3),
  .tx-table th:nth-child(4),.tx-table td:nth-child(4),
  .tx-table th:nth-child(8),.tx-table td:nth-child(8),
  .tx-table th:nth-child(9),.tx-table td:nth-child(9){display:none}
  .tx-table th,.tx-table td{padding:8px 4px}
  .alloc-row{flex-direction:column;align-items:stretch;gap:10px}
  .alloc-name,.alloc-bars,.alloc-nums{width:100%;min-width:0}
  .alloc-nums{text-align:left}
  .alloc-line .lbl{width:auto;text-align:left}
  .modal-head{padding:12px 14px}
  .modal-body{padding:14px}
  .modal-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  .form-grid{grid-template-columns:1fr;gap:10px}
  .form-item input,.form-item select,.toolbar select,.topbar select{font-size:16px}
  .batch-table input{width:90px;font-size:16px}
  #toast{bottom:calc(28px + env(safe-area-inset-bottom));max-width:92vw}
  /* 定投参考 */
  .mon-card{padding:12px 14px}
  .mon-head{margin-bottom:8px}
  .mon-table td:first-child{width:42%}
  .mon-table .val{width:auto}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>投资管理平台</h1>
    <div class="topbar-actions">
      <span id="syncDot" class="sync-dot" title="本地模式（未配置云端）"></span>
      <button id="btnLogout" class="btn ghost" style="display:none" title="退出云端登录">退出</button>
      <button id="btnQuote" class="btn primary" title="从东方财富公开接口拉取全部 ETF 实时行情">⟳ 行情</button>
      <select id="quoteAuto" title="交易时段（工作日 9:30-15:00）自动刷新间隔">
        <option value="0">自动:关</option>
        <option value="10">自动:10s</option>
        <option value="30">自动:30s</option>
        <option value="60">自动:60s</option>
      </select>
      <button id="btnExportJson" class="btn ghost">导出JSON</button>
      <button id="btnImportJson" class="btn ghost">导入恢复</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </header>

  <section class="summary" id="summary"></section>

  <section id="planSection" class="plan-section"></section>

  <nav class="tabs">
    <button class="tab active" data-tab="holdings">当前持仓</button>
    <button class="tab" data-tab="transactions">交易流水</button>
    <button class="tab" data-tab="alloc">资产配置</button>
    <button class="tab" data-tab="monitor">定投参考</button>
  </nav>

  <main id="view-holdings" class="view active" data-view="holdings">
    <div class="section-head">
      <h2 id="holdingsTitle">当前持仓（0只）</h2>
      <div class="grow"></div>
      <button id="btnRefresh" class="btn ghost" title="手动批量录入现价（兜底；在线拉取用顶栏「⟳ 行情」）">手动</button>
      <button id="btnNewHolding" class="btn primary">+新增持仓</button>
    </div>
    <div id="holdingList"></div>
  </main>

  <main id="view-transactions" class="view" data-view="transactions">
    <div class="toolbar">
      <span class="tool-label">排序</span>
      <button id="sortDate" class="btn chip">按日期</button>
      <button id="sortCode" class="btn chip">按代码</button>
      <span class="tool-label" style="margin-left:10px">筛选</span>
      <select id="txFilter"></select>
      <div class="grow"></div>
      <button id="btnExportCsv" class="btn primary">导出CSV</button>
    </div>
    <div class="table-wrap">
      <table class="tx-table">
        <thead>
          <tr>
            <th>日期</th><th>操作</th><th>代码</th><th>名称</th>
            <th>单价</th><th>数量(股)</th><th>金额</th><th>手续费</th><th>备注</th><th></th>
          </tr>
        </thead>
        <tbody id="txBody"></tbody>
      </table>
    </div>
  </main>

  <main id="view-alloc" class="view" data-view="alloc">
    <div id="allocContent"></div>
  </main>

  <main id="view-monitor" class="view" data-view="monitor">
    <div class="section-head">
      <h2>定投参考</h2>

<script>
'use strict';

const STORE_KEY = 'invPlatformData_v1';
const SYNC_KEY = 'invSyncMeta_v1';
const SUPABASE_TABLE = 'investment_data';
const SUPABASE_URL = 'https://gqjbtbxtkiptjeryqawd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xAbx5HkUJCMssWBtPWzgCw_9UDQNrc2';
const MONITOR_SECRET = 'mon_19850915!888888'; // 定投参考：与 Supabase Edge Function 的 MONITOR_SECRET 一致（防滥用共享串，非保密）
const FEE_RATE = 0.0001;
const FEE_MIN = 5;

const SEED = [
  { code: '510880', name: '红利', type: 'etf' },
  { code: '159819', name: 'AI', type: 'etf' },
  { code: '513100', name: '纳指', type: 'etf' },
  { code: '510300', name: '沪深300', type: 'etf' },
  { code: '518880', name: '黄金ETF', type: 'etf' },
  { code: '021000', name: '纳指定投', type: 'fund' }
];

let state = null;
let txSort = { key: 'date', dir: -1 };
let txFilterCode = '';
let toastTimer = null;
let corruptBackup = false;
let sb = null;
const mqMobile = window.matchMedia ? window.matchMedia('(max-width:768px)') : { matches: false, addEventListener() {}, addListener() {} };
try {
  if (window.supabase && typeof window.supabase.createClient === 'function' && SUPABASE_URL && SUPABASE_KEY) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch (e) { sb = null; }
let sessionReady = false;
let pushTimer = null;
let syncBusy = false;
let syncMeta = { baseRevision: 0, dirty: false };

function el(id) { return document.getElementById(id); }
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}
function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function round4(n) { return Math.round(n * 10000) / 10000; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtMoney(n) {
  return (Number(n) || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtSigned(n) {
  const v = Number(n) || 0;
  return (v > 0 ? '+' : v < 0 ? '-' : '') + fmtMoney(Math.abs(v));
}
function fmtPrice(n, type) {
  const dec = type === 'fund' ? 4 : 3;
  return (Number(n) || 0).toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtShares(n, type) {
  if (type === 'fund') return (Number(n) || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (Number(n) || 0).toLocaleString('zh-CN', { maximumFractionDigits: 0 });
}
function fmtSignedShares(n, type) {
  const v = Number(n) || 0;
  return (v > 0 ? '+' : v < 0 ? '-' : '') + fmtShares(Math.abs(v), type);
}
function fmtPct(ratio) {
  const p = (Number(ratio) || 0) * 100;
  return (p > 0 ? '+' : '') + p.toFixed(2) + '%';
}
function cls(n) { n = Number(n) || 0; return n > 0 ? 'up' : n < 0 ? 'down' : ''; }
function shortDate(d) {
  if (!d) return '未更新';
  const parts = String(d).split('-');
  return parts.length === 3 ? parts[1] + '-' + parts[2] : d;
}
function calcFee(type, amount) {
  if (type === 'fund') return 0;
  return round2(Math.max(FEE_MIN, round2(amount * FEE_RATE)));
}

function defaultState() {
  return {
    holdings: SEED.map((s, i) => ({
      id: uid(), code: s.code, name: s.name, type: s.type,
      shares: s.type === 'fund' ? 1 : 0, avgCost: 0, currentPrice: 0,
      prevClose: 0, todayOpen: 0,
      lastUpdate: '', cleared: false, order: i + 1
    })),
    transactions: [],
    plans: [],
    activePlanId: null,
    monitoring: {},
    settings: { quoteAutoSec: 0 }
  };
}
function migrateFund(data) {
  (data.holdings || []).forEach(h => {
    if (h.type !== 'fund') return;
    const sh = Number(h.shares) || 0;
    if (sh !== 1 && sh > 0) {
      h.avgCost = round2((Number(h.avgCost) || 0) * sh);
      h.currentPrice = round2((Number(h.currentPrice) || 0) * sh);
    }
    h.shares = 1;
    h.prevClose = 0;
    h.todayOpen = 0;
  });
}
const LEGACY_SEED_CODES = ['510880', '159819', '513100', '021000', '510300', '518880'];
function reorderLegacySeed(data) {
  if (!data.settings || data.settings.seedReordered) return;
  const hs = [...data.holdings].sort((a, b) => (a.order || 0) - (b.order || 0));
  if (hs.length === LEGACY_SEED_CODES.length && hs.every((h, i) => h.code === LEGACY_SEED_CODES[i])) {
    const byCode = {};
    data.holdings.forEach(h => { byCode[h.code] = h; });
    SEED.forEach((s, i) => { if (byCode[s.code]) byCode[s.code].order = i + 1; });
  }
  data.settings.seedReordered = true;
}
function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return defaultState(); }
  if (!raw) return defaultState();
  try {
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.holdings)) throw new Error('bad data');
    data.transactions = Array.isArray(data.transactions) ? data.transactions : [];
    data.plans = Array.isArray(data.plans) ? data.plans : [];
    data.activePlanId = data.activePlanId || null;
    if (!data.monitoring || typeof data.monitoring !== 'object' || Array.isArray(data.monitoring)) data.monitoring = {};
    normalizeSettings(data);
    reorderLegacySeed(data);
    migrateFund(data);
    return data;
  } catch (e) {
    try { localStorage.setItem(STORE_KEY + '_corrupted_backup', raw); } catch (e2) {}
    corruptBackup = true;
    return defaultState();
  }
}
function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
  scheduleCloudPush();
}

try {
  const m = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null');
  if (m && Number.isFinite(m.baseRevision)) syncMeta = { baseRevision: Number(m.baseRevision), dirty: !!m.dirty };
} catch (e) {}
function saveSyncMeta() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(syncMeta)); } catch (e) {} }
function setSyncDot(mode, tip) {
  const d = el('syncDot');
  if (!d) return;
  d.className = 'sync-dot' + (mode ? ' ' + mode : '');
  d.title = tip || '';
}
function syncQuoteSel() {
  const q = el('quoteAuto');
  if (q && state && state.settings) q.value = String(state.settings.quoteAutoSec);
}
function scheduleCloudPush() {
  if (!sb || !sessionReady) return;
  syncMeta.dirty = true;
  saveSyncMeta();
  setSyncDot('pending', '有改动待推送到云端');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(flushCloudPush, 5000);
}
async function flushCloudPush() {
  clearTimeout(pushTimer);
  pushTimer = null;
  if (!sb || !sessionReady || !syncMeta.dirty || syncBusy) return;
  syncBusy = true;
  try {
    const { data, error } = await sb.from(SUPABASE_TABLE)
      .update({ data: state, revision: syncMeta.baseRevision + 1, updated_at: new Date().toISOString() })
      .eq('id', 1)
      .eq('revision', syncMeta.baseRevision)
      .select();
    if (error) throw error;
    if (!data || !data.length) { await handlePushConflict(); return; }
    syncMeta.baseRevision = Number(data[0].revision);
    syncMeta.dirty = false;
    saveSyncMeta();
    setSyncDot('ok', '已同步到云端');
  } catch (e) {
    setSyncDot('err', '云端同步失败，稍后自动重试');
    setTimeout(() => { if (syncMeta.dirty) flushCloudPush(); }, 30000);
  } finally {
    syncBusy = false;
  }
}
async function forcePush() {
  if (!sb || !sessionReady) return;
  syncBusy = true;
  try {
    const cur = await sb.from(SUPABASE_TABLE).select('revision').eq('id', 1).limit(1);
    if (cur.error) throw cur.error;
    const next = ((cur.data && cur.data[0] && Number(cur.data[0].revision)) || 0) + 1;
    const { data, error } = await sb.from(SUPABASE_TABLE)
      .update({ data: state, revision: next, updated_at: new Date().toISOString() })
      .eq('id', 1)
      .select();
    if (error) throw error;
    if (data && data.length) {
      syncMeta.baseRevision = Number(data[0].revision);
      syncMeta.dirty = false;
      saveSyncMeta();
      setSyncDot('ok', '已同步到云端');
    }
  } catch (e) {
    setSyncDot('err', '云端覆盖失败，稍后会自动重试');
    syncMeta.dirty = true;
    saveSyncMeta();
    setTimeout(() => { if (syncMeta.dirty) flushCloudPush(); }, 30000);
  } finally {
    syncBusy = false;
  }
}
function adoptRemote(row) {
  try {
    const norm = normalizeImport(row.data);
    clearTimeout(pushTimer);
    pushTimer = null;
    state = norm;
    syncMeta.baseRevision = Number(row.revision);
    syncMeta.dirty = false;
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    saveSyncMeta();
    renderAll();
    setSyncDot('ok', '已同步到云端');
    return true;
  } catch (e) { return false; }
}
async function handlePushConflict() {
  try {
    const { data: rows, error } = await sb.from(SUPABASE_TABLE).select('data,revision').eq('id', 1).limit(1);
    const r = rows && rows[0];
    if (!error && r && r.data && Array.isArray(r.data.holdings)) {
      conflictDialog({ revision: Number(r.revision), data: r.data });
    } else {
      setSyncDot('err', '检测到同步冲突，但无法读取云端数据');
    }
  } catch (e) {
    setSyncDot('err', '检测到同步冲突，但无法读取云端数据');
  }
}
function conflictDialog(remoteRow) {
  let remoteNorm = null;
  try { remoteNorm = normalizeImport(remoteRow.data); } catch (e) {}
  const ov = openModal({
    title: '检测到其他设备的修改',
    body: '<div class="confirm-msg">云端已有更新的数据（版本 v' + remoteRow.revision + '），而本地还有未推送的改动。<br><br>' +
      '<b>加载云端版本</b>：丢弃本地未推送的改动<br><b>强制覆盖云端</b>：用本地数据替换云端数据</div>',
    foot: '<button class="btn" data-remote>加载云端版本</button>' +
          '<button class="btn danger" data-force>强制覆盖云端</button>'
  });
  ov.querySelector('[data-remote]').onclick = () => {
    ov.close();
    if (!remoteNorm) { toast('云端数据异常，无法加载'); return; }
    clearTimeout(pushTimer);
    pushTimer = null;
    state = remoteNorm;
    syncMeta.baseRevision = remoteRow.revision;
    syncMeta.dirty = false;
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    saveSyncMeta();
    renderAll();
    setSyncDot('ok', '已同步到云端');
    toast('已加载云端最新数据');
  };
  ov.querySelector('[data-force]').onclick = async () => {
    ov.close();
    await forcePush();
    toast(syncMeta.dirty ? '覆盖失败，稍后自动重试' : '已用本地数据覆盖云端');
  };
}
async function pullIfNewer() {
  if (!sb || !sessionReady || syncBusy) return;
  try {
    if (syncMeta.dirty) { await flushCloudPush(); return; }
    const { data: rows, error } = await sb.from(SUPABASE_TABLE).select('data,revision').eq('id', 1).limit(1);
    const r = rows && rows[0];
    if (error || !r || !r.data || !Array.isArray(r.data.holdings)) return;
    if (Number(r.revision) > syncMeta.baseRevision) {
      adoptRemote({ revision: Number(r.revision), data: r.data });
      toast('已同步其他设备的最新改动');
    }
  } catch (e) {}
}

function getHolding(id) { return state.holdings.find(h => h.id === id); }
function marketValue(h) { return (h.shares || 0) * (h.currentPrice || 0); }
function totalMarketValue() { return state.holdings.reduce((s, h) => s + marketValue(h), 0); }
function totalCost() { return state.holdings.reduce((s, h) => s + (h.shares || 0) * (h.avgCost || 0), 0); }
function posPL(h) {
  if (!(h.currentPrice > 0) || !(h.shares > 0)) return null;
  const pl = (h.currentPrice - h.avgCost) * h.shares;
  const denom = h.avgCost * h.shares;
  return { pl, pct: denom > 0 ? pl / denom : null };
}
function ym(s) { const a = String(s).split('-'); return (+a[0]) * 12 + ((+a[1]) || 1) - 1; }
function timeProgress(p) {
  if (!p || !p.startDate || !p.endDate) return 0;
  const total = ym(p.endDate) - ym(p.startDate) + 1;
  if (total <= 0) return 0;
  const done = Math.min(total, Math.max(0, ym(today()) - ym(p.startDate) + 1));
  return done / total;
}
function getActivePlan() {
  let p = state.plans.find(x => x.id === state.activePlanId);
  if (!p) {
    const t = today();
    p = state.plans.find(x => x.startDate <= t && t <= x.endDate) || null;
  }
  return p || null;
}
function shortMonth(d) { const a = String(d).split('-'); return a.length >= 2 ? (+a[1]) + '月' : d; }
function sortedHoldings() { return [...state.holdings].sort((a, b) => a.order - b.order); }
function nextOrder() { return state.holdings.reduce((m, h) => Math.max(m, h.order || 0), 0) + 1; }
function computeOrderAfterDrop(allSorted, draggedId, beforeId) {
  const ids = allSorted.map(h => h.id).filter(id => id !== draggedId);
  const at = beforeId ? ids.indexOf(beforeId) : ids.length;
  if (at === -1) return null;
  ids.splice(at, 0, draggedId);
  return ids;
}
function applyReorder(draggedId, beforeId) {
  if (!getHolding(draggedId)) return;
  if (!beforeId) beforeId = null;
  if (beforeId === draggedId) return;
  if (beforeId && !getHolding(beforeId)) return;
  const ids = computeOrderAfterDrop(sortedHoldings(), draggedId, beforeId);
  if (!ids) return;
  const pos = {};
  ids.forEach((id, i) => { pos[id] = i + 1; });
  state.holdings.forEach(h => { if (pos[h.id]) h.order = pos[h.id]; });
  save();
  renderAll();
}
function initDragSort() {
  const list = el('holdingList');
  let dragId = null;
  list.addEventListener('dragstart', e => {
    const card = e.target.closest('.holding[data-id]');
    if (!card) return;
    dragId = card.dataset.id;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
  });
  list.addEventListener('dragend', () => {
    dragId = null;
    list.querySelectorAll('.holding.dragging,.holding.drop-hint').forEach(x => x.classList.remove('dragging', 'drop-hint'));
  });
  list.addEventListener('dragover', e => {
    if (!dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const card = e.target.closest('.holding[data-id]');
    list.querySelectorAll('.holding.drop-hint').forEach(x => x.classList.remove('drop-hint'));
    if (card && card.dataset.id !== dragId) card.classList.add('drop-hint');
  });
  list.addEventListener('drop', e => {
    if (!dragId) return;
    e.preventDefault();
    const card = e.target.closest('.holding[data-id]');
    const targetId = card && card.dataset.id !== dragId ? card.dataset.id : null;
    const id = dragId;
    dragId = null;
    applyReorder(id, targetId);
  });
}
/* 手机端长按拖动排序（v0.8.0）：复用 computeOrderAfterDrop/applyReorder，仅 touch 指针生效 */
function initTouchDragSort() {
  const list = el('holdingList');
  let g = null;
  function clearHint() {
    if (g && g.hintEl) { g.hintEl.classList.remove('drop-hint'); g.hintEl = null; }
  }
  function reset(swallow) {
    if (!g) return;
    clearTimeout(g.timer);
    if (g.hintEl) g.hintEl.classList.remove('drop-hint');
    if (g.active) {
      g.card.classList.remove('dragging');
      g.card.style.transform = '';
      g.card.style.pointerEvents = '';
    }
    const wasActive = g.active, id = g.id, beforeId = g.beforeId || null;
    g = null;
    if (wasActive) {
      if (swallow) {
        const kill = ev => { ev.stopPropagation(); ev.preventDefault(); };
        list.addEventListener('click', kill, { capture: true, once: true });
        setTimeout(() => list.removeEventListener('click', kill, { capture: true }), 400);
      }
      return { id, beforeId };
    }
    return null;
  }
  list.addEventListener('touchstart', e => {
    if (g || !e.touches.length) return;
    const t = e.touches[0];
    const card = e.target.closest('.holding[data-id]');
    if (!card || e.target.closest('button')) return;
    g = { card, id: card.dataset.id, sx: t.clientX, sy: t.clientY,
          timer: setTimeout(() => {
            if (!g) return;
            g.active = true;
            g.card.classList.add('dragging');
            g.card.style.pointerEvents = 'none';
          }, 300), active: false, hintEl: null, beforeId: null };
  }, { passive: true });
  list.addEventListener('touchmove', e => {
    if (!g) return;
    const t = e.touches[0];
    if (!g.active) {
      if (Math.abs(t.clientY - g.sy) > 10 || Math.abs(t.clientX - g.sx) > 10) reset(false);
      return;
    }
    e.preventDefault();
    g.card.style.transform = 'translateY(' + (t.clientY - g.sy) + 'px)';
    const hit = document.elementFromPoint(t.clientX, t.clientY);
    const over = hit && hit.closest ? hit.closest('.holding[data-id]') : null;
    if (over && over !== g.card) {
      if (g.hintEl !== over) { clearHint(); g.hintEl = over; over.classList.add('drop-hint'); }
      g.beforeId = over.dataset.id;
    } else {
      clearHint();
      const rect = list.getBoundingClientRect();
      if (t.clientY > rect.bottom - 24) { g.toEnd = true; g.beforeId = null; }
      else { g.toEnd = false; g.beforeId = null; }
    }
  }, { passive: false });
  list.addEventListener('touchend', () => {
    if (!g) return;
    const moved = g.active && (g.hintEl || g.toEnd);
    const r = reset(true);
    if (moved && r) applyReorder(r.id, r.beforeId);
  });
  list.addEventListener('touchcancel', () => reset(false));
}
function codeOf(t) { const h = getHolding(t.holdingId); return h ? h.code : ''; }
function opInfo(t) {
  if (t.type === 'buy') return { txt: '买入', c: 'up' };
  return t.clearance ? { txt: '清仓', c: 'down' } : { txt: '卖出', c: 'down' };
}

function pushTx(t) {
  t.id = uid();
  t.date = t.date || today();
  state.transactions.push(t);
}
function applyTxOnHolding(h, t) {
  const oldCost = (h.avgCost || 0) * (h.shares || 0);
  if (t.type === 'buy') {
    const cost = oldCost + t.amount + t.fee;
    h.shares = round4((h.shares || 0) + t.shares);
    h.avgCost = h.shares > 0 ? cost / h.shares : 0;
  } else {
    const cost = oldCost - (t.amount - t.fee);
    h.shares = round4((h.shares || 0) - t.shares);
    h.avgCost = h.shares > 0 ? cost / h.shares : 0;
  }
}
function undoTxOnHolding(h, t) {
  const amount = t.amount != null ? t.amount : round2(t.shares * t.price);
  const fee = t.fee || 0;
  const oldCost = (h.avgCost || 0) * (h.shares || 0);
  if (t.type === 'buy') {
    const cost = oldCost - (amount + fee);
    h.shares = round4((h.shares || 0) - t.shares);
    h.avgCost = h.shares > 0 ? cost / h.shares : 0;
  } else {
    const cost = oldCost + (amount - fee);
    h.shares = round4((h.shares || 0) + t.shares);
    h.avgCost = h.shares > 0 ? cost / h.shares : 0;
  }
}
function applyBuy(h, s, p, f, note, date) {
  const amount = round2(s * p);
  applyTxOnHolding(h, { type: 'buy', shares: s, price: p, amount, fee: f });
  h.cleared = false;
  pushTx({ holdingId: h.id, type: 'buy', shares: s, price: p, amount, fee: f, date, note: note || '' });
}
function applySell(h, s, p, f, note, clearance, date) {
  const amount = round2(s * p);
  applyTxOnHolding(h, { type: 'sell', shares: s, price: p, amount, fee: f });
  if ((h.shares || 0) <= 0) h.cleared = true;
  pushTx({ holdingId: h.id, type: 'sell', shares: s, price: p, amount, fee: f, date, note: note || '', clearance: !!clearance });
}

function renderSummary() {
  const mv = totalMarketValue(), cost = totalCost(), pl = mv - cost;
  const pct = cost > 0 ? pl / cost : 0;
  el('summary').innerHTML =
    '<div class="sum-card"><div class="sum-lbl">总市值</div><div class="sum-val num">' + fmtMoney(mv) + '</div></div>' +
    '<div class="sum-card"><div class="sum-lbl">总成本</div><div class="sum-val num">' + fmtMoney(cost) + '</div></div>' +
    '<div class="sum-card"><div class="sum-lbl">总盈亏</div><div class="sum-val num ' + cls(pl) + '">' + fmtSigned(pl) +
    ' <span class="sum-pct">(' + fmtPct(pct) + ')</span></div></div>';
}

function statBlock(lbl, valHtml) {
  return '<div class="stat"><div class="lbl">' + lbl + '</div><div class="val num">' + valHtml + '</div></div>';
}

function plText(pl, pct) {
  let s = '<span class="' + cls(pl) + '">' + fmtSigned(pl) + '</span>';
  if (pct !== null) s += ' <span class="' + cls(pl) + '">(' + fmtPct(pct) + ')</span>';
  return s;
}

function cardBodyHTML(h) {
  const sharesTxt = fmtShares(h.shares, h.type);
  const priceTxt = h.currentPrice > 0 ? fmtPrice(h.currentPrice, h.type) : '--';
  const r = posPL(h);
  let dayPL = null, dayPct = null;
  if (h.prevClose > 0 && h.currentPrice > 0) {
    dayPL = (h.currentPrice - h.prevClose) * h.shares;
    dayPct = h.currentPrice / h.prevClose - 1;
  }
  return statBlock('持股数', sharesTxt) +
    statBlock('均价', h.avgCost > 0 ? fmtPrice(h.avgCost, h.type) : '--') +
    statBlock('现价', priceTxt) +
    statBlock('持仓盈亏', r === null ? '--' : plText(r.pl, r.pct)) +
    statBlock('今日盈亏', dayPL === null ? '--' : plText(dayPL, dayPct)) +
    statBlock('今开', h.todayOpen > 0 ? fmtPrice(h.todayOpen, h.type) : '--') +
    statBlock('昨收', h.prevClose > 0 ? fmtPrice(h.prevClose, h.type) : '--');
}

function fundBodyHTML(h) {
  const r = posPL(h);
  return statBlock('投入成本', h.avgCost > 0 ? fmtMoney(h.avgCost) : '--') +
    statBlock('最新市值', h.currentPrice > 0 ? fmtMoney(h.currentPrice) : '--') +
    statBlock('持仓盈亏', r === null ? '--' : plText(r.pl, r.pct));
}

function cardHTML(h) {

    actions =
      '<button class="btn chip" data-act="edit">编辑</button>' +

    '<div class="holding-head">' +

function renderHoldings() {
  const visible = sortedHoldings().filter(h => !h.cleared);
  el('holdingsTitle').textContent = '当前持仓（' + visible.length + '只）';
  el('holdingList').innerHTML = visible.length
    ? visible.map(cardHTML).join('')
    : '<div class="empty">暂无持仓，点击右上角「+新增持仓」开始记录</div>';
}

function txRows() {
  let rows = state.transactions.map((t, i) => ({ t, i }));
  if (txFilterCode) rows = rows.filter(r => codeOf(r.t) === txFilterCode);
  rows.sort((a, b) => {
    let r = 0;
    if (txSort.key === 'date') {
      r = a.t.date < b.t.date ? -1 : a.t.date > b.t.date ? 1 : 0;
      if (r === 0) r = a.i - b.i;
    } else {
      const ca = codeOf(a.t), cb = codeOf(b.t);
      r = ca < cb ? -1 : ca > cb ? 1 : 0;
      if (r === 0) r = a.t.date < b.t.date ? -1 : a.t.date > b.t.date ? 1 : 0;
      if (r === 0) r = a.i - b.i;
    }
    return r * txSort.dir;
  });
  return rows.map(r => r.t);
}

function renderTransactions() {
  el('sortDate').textContent = '按日期' + (txSort.key === 'date' ? (txSort.dir === 1 ? ' ↑' : ' ↓') : '');
  el('sortCode').textContent = '按代码' + (txSort.key === 'code' ? (txSort.dir === 1 ? ' ↑' : ' ↓') : '');
  const rows = txRows();
  const tbody = el('txBody');
  if (!rows.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="10">暂无交易记录</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(t => {
    const h = getHolding(t.holdingId) || {};
    const type = h.type || 'etf';
    const op = opInfo(t);
    return '<tr data-id="' + t.id + '">' +
      '<td class="num">' + (mqMobile.matches ? esc(shortDate(t.date)) : esc(t.date)) + '</td>' +
      '<td class="' + op.c + '">' + op.txt + '</td>' +

      '<td>' + esc(h.name || '') + '</td>' +
      '<td class="num">' + fmtPrice(t.price, type) + '</td>' +
      '<td class="num">' + fmtSignedShares(t.type === 'buy' ? t.shares : -t.shares, type) + '</td>' +
      '<td class="num ' + (t.type === 'buy' ? 'up' : 'down') + '">' + fmtSigned(t.type === 'buy' ? t.amount : -t.amount) + '</td>' +
      '<td class="num">' + fmtMoney(t.fee) + '</td>' +

      '<td><div class="row-actions"><span class="link-edit" data-edit="' + t.id + '">编辑</span><span class="link-del" data-del="' + t.id + '">删除</span></div></td>' +
    '</tr>';
  }).join('');
}

function openModal(opts) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML =
    '<div class="modal' + (opts.wide ? ' wide' : '') + '">' +
      '<div class="modal-head"><span class="modal-title">' + opts.title + '</span><button class="modal-close">×</button></div>' +
      '<div class="modal-body">' + opts.body + '</div>' +
      (opts.foot ? '<div class="modal-foot">' + opts.foot + '</div>' : '') +
    '</div>';
  el('modalRoot').appendChild(ov);
  const onKey = e => { if (e.key === 'Escape') close(); };
  function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
  document.addEventListener('keydown', onKey);
  ov.querySelector('.modal-close').onclick = close;
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  ov.close = close;
  return ov;
}

function confirmDialog(msg, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    let settled = false;
    const done = v => { if (!settled) { settled = true; resolve(v); } };
    const ov = openModal({
      title: opts.title || '确认操作',
      body: '<div class="confirm-msg">' + msg + '</div>',
      foot: '<button class="btn" data-x>取消</button>' +
            '<button class="btn ' + (opts.danger === false ? 'primary' : 'danger') + '" data-ok>' + (opts.okText || '确认') + '</button>'
    });
    ov.querySelector('[data-x]').onclick = () => { ov.close(); done(false); };
    ov.querySelector('[data-ok]').onclick = () => { ov.close(); done(true); };
    const mo = new MutationObserver(() => {
      if (!document.body.contains(ov)) { mo.disconnect(); done(false); }
    });
    mo.observe(el('modalRoot'), { childList: true });
  });
}

function toast(msg) {
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function fieldHTML(o) {
  return '<div class="form-item' + (o.span ? ' span2' : '') + '"' +
    (o.itemId ? ' id="' + o.itemId + '"' : '') +
    (o.itemStyle ? ' style="' + o.itemStyle + '"' : '') +
    '><label>' + o.label + '</label>' +
    '<input id="' + o.id + '" type="' + (o.type || 'text') + '" value="' + esc(o.value == null ? '' : o.value) + '"' +
    (o.step ? ' step="' + o.step + '"' : '') +
    (o.min !== undefined ? ' min="' + o.min + '"' : '') +
    (o.readonly ? ' readonly' : '') +
    (o.placeholder ? ' placeholder="' + esc(o.placeholder) + '"' : '') +
    '></div>';
}

function checkShares(s) {
  if (!(s > 0)) return '请输入正确的数量';
  if (!Number.isInteger(s)) return '场内ETF数量须为整数';
  return '';
}
function bindFeeCalc(qty, price, fee, getType) {
  const upd = () => {
    fee.value = calcFee(getType(), (parseFloat(qty.value) || 0) * (parseFloat(price.value) || 0)).toFixed(2);
  };
  qty.oninput = upd;
  price.oninput = upd;
  upd();
}
function bindDerivedCost(ov, mvSel, plSel, costSel) {
  const mv = ov.querySelector(mvSel), pl = ov.querySelector(plSel), cost = ov.querySelector(costSel);
  const upd = () => {
    const m = parseFloat(mv.value), g = parseFloat(pl.value);
    cost.value = Number.isFinite(m) && Number.isFinite(g) ? round2(m - g) : '';
  };
  mv.oninput = upd;
  pl.oninput = upd;
  upd();
}
function readMvPl(ov, mvSel, plSel) {
  const m = parseFloat(ov.querySelector(mvSel).value);
  const g = parseFloat(ov.querySelector(plSel).value);
  if (!Number.isFinite(m) || !(m >= 0)) return { err: '请输入正确的最新市值' };
  if (!Number.isFinite(g)) return { err: '请输入正确的持仓盈亏' };
  if (m - g < 0) return { err: '持仓盈亏不能大于最新市值（成本会算成负数）' };
  return { mv: m, pl: g, cost: round2(m - g) };
}
function codeExists(code, excludeId) {
  return state.holdings.some(x => x.id !== excludeId && x.code === code && !x.cleared);
}

function openTradeModal(id, mode) {
  const h = getHolding(id);
  if (!h) return;
  const isBuy = mode === 'buy';
  const verb = isBuy ? '买入' : '卖出';
  const title = verb + ' - ' + esc(h.code) + ' ' + esc(h.name);
  const hint = !isBuy ? '<div class="hint">当前持股：<b class="num">' + fmtShares(h.shares, h.type) + '</b></div>' : '';
  const body = hint +
    '<div class="form-grid">' +
      fieldHTML({ label: verb + '单价', id: 'tPrice', type: 'number', value: h.currentPrice > 0 ? h.currentPrice : '', step: '0.001', min: 0 }) +
      fieldHTML({ label: '数量（股）', id: 'tQty', type: 'number', value: '', step: '1', min: 0 }) +
      fieldHTML({ label: '日期', id: 'tDate', type: 'date', value: today() }) +
      fieldHTML({ label: '手续费（自动计算）', id: 'tFee', value: '0.00', readonly: true }) +
      fieldHTML({ label: '备注（选填）', id: 'tNote', span: true }) +
    '</div>' +
    '<div class="err" id="tErr"></div>';
  const ov = openModal({
    title,
    body,
    foot: '<button class="btn" data-x>取消</button>' +
          '<button class="btn ' + (isBuy ? 'buy-solid' : 'sell-solid') + '" data-go>确认' + verb + '</button>'
  });
  const qty = ov.querySelector('#tQty'), price = ov.querySelector('#tPrice'),
        fee = ov.querySelector('#tFee'), note = ov.querySelector('#tNote');
  bindFeeCalc(qty, price, fee, () => h.type);
  ov.querySelector('[data-x]').onclick = ov.close;
  ov.querySelector('[data-go]').onclick = () => {
    const s = parseFloat(qty.value), p = parseFloat(price.value);
    const errEl = ov.querySelector('#tErr');
    let msg = checkShares(s);
    if (!msg && !isBuy && s > h.shares + 1e-9) msg = '卖出数量不能超过当前持股 ' + fmtShares(h.shares, h.type);
    if (!msg && !(p > 0)) msg = '请输入正确的价格';
    if (msg) { errEl.textContent = msg; return; }
    const f = calcFee(h.type, round2(s * p));
    const date = ov.querySelector('#tDate').value || today();
    if (isBuy) applyBuy(h, s, p, f, note.value.trim(), date);
    else applySell(h, s, p, f, note.value.trim(), false, date);
    save();
    renderAll();
    ov.close();
    toast(verb + '已记录');
  };
}

function openNewHoldingModal() {

const QUOTE_URL = 'https://push2.eastmoney.com/api/qt/ulist.np/get';
const QUOTE_FIELDS = 'f12,f14,f2,f17,f18,f124';
const QUOTE_TIMEOUT = 8000;
const QUOTE_INTERVALS = [10, 30, 60];
let quoteTimer = null;
let quoteBusy = false;
let lastQuoteErrToastAt = 0;

function normalizeSettings(data) {
  const s = data.settings && typeof data.settings === 'object' ? data.settings : {};
  const sec = Number(s.quoteAutoSec);
  s.quoteAutoSec = QUOTE_INTERVALS.indexOf(sec) !== -1 ? sec : 0;
  data.settings = s;
}
function secidOf(code) {
  const c = String(code);
  return (/^[569]/.test(c) ? '1.' : '0.') + c;
}
function isTradingTime() {
  const d = new Date();
  const day = d.getDay();
  if (day === 0 || day === 6) return false;
  const m = d.getHours() * 60 + d.getMinutes();
  return m >= 570 && m <= 900;
}
function jsonpQuote(secids) {
  return new Promise((resolve, reject) => {
    const cbName = 'jpQuote' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
    let done = false;
    const script = document.createElement('script');
    const cleanup = () => {
      if (done) return;
      done = true;
      clearTimeout(tid);
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    const tid = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, QUOTE_TIMEOUT);
    window[cbName] = data => {
      cleanup();
      resolve(data && data.data && Array.isArray(data.data.diff) ? data.data.diff : []);
    };
    script.onerror = () => { cleanup(); reject(new Error('network')); };
    script.src = QUOTE_URL + '?secids=' + encodeURIComponent(secids) +
      '&fields=' + QUOTE_FIELDS + '&fltt=2&cb=' + cbName + '&_=' + Date.now();
    document.head.appendChild(script);
  });
}
function quoteErrToast(silent, msg) {
  if (!silent) { toast(msg); return; }
  const now = Date.now();
  if (now - lastQuoteErrToastAt >= 60000) { lastQuoteErrToastAt = now; toast(msg); }
}
async function fetchQuotes(silent) {
  if (quoteBusy) return;
  const hs = sortedHoldings().filter(h => !h.cleared && h.type !== 'fund');
  if (!hs.length) { if (!silent) toast('暂无可拉取的 ETF 持仓'); return; }
  const byCode = {};
  hs.forEach(h => { byCode[h.code] = h; });
  quoteBusy = true;
  el('btnQuote').disabled = true;
  try {
    const diff = await jsonpQuote(hs.map(h => secidOf(h.code)).join(','));
    const updated = [];
    let ts = 0;
    diff.forEach(q => {
      const h = byCode[q.f12];
      if (!h) return;
      const price = Number(q.f2), open = Number(q.f17), prev = Number(q.f18);
      if (!Number.isFinite(price) || !(price > 0)) return;
      h.currentPrice = price;
      h.prevClose = Number.isFinite(prev) && prev > 0 ? prev : 0;
      h.todayOpen = Number.isFinite(open) && open > 0 ? open : 0;
      updated.push(h);
      const t = Number(q.f124);
      if (Number.isFinite(t) && t > ts) ts = t;
    });
    if (updated.length) {
      const d = today();
      updated.forEach(h => { h.lastUpdate = d; });
      save();
      renderAll();
      let tstr = '';
      if (ts > 0) {
        const qt = new Date(ts * 1000);
        tstr = ' · 行情 ' + String(qt.getHours()).padStart(2, '0') + ':' + String(qt.getMinutes()).padStart(2, '0');
      }
      if (!silent) toast('已更新 ' + updated.length + ' 只标的现价' + tstr);
    } else {
      quoteErrToast(silent, '接口未返回有效行情，请改用手动录入');
    }
  } catch (e) {
    quoteErrToast(silent, '行情拉取失败，可稍后重试或用手动录入');
  } finally {
    quoteBusy = false;
    el('btnQuote').disabled = false;
  }
}
function setQuoteTimer() {
  clearInterval(quoteTimer);
  quoteTimer = null;
  const sec = state.settings ? Number(state.settings.quoteAutoSec) || 0 : 0;
  if (sec > 0) {
    quoteTimer = setInterval(() => {
      if (quoteBusy || document.hidden || !isTradingTime()) return;
      fetchQuotes(true);
    }, sec * 1000);
  }
}

function download(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function csvCell(v) {

function exportCsv() {

  rows.forEach(t => {
    const h = getHolding(t.holdingId) || {};
    const sign = t.type === 'buy' ? 1 : -1;
    lines.push([
      t.date, opInfo(t).txt, h.code || '', h.name || '',
      t.price, sign * t.shares, (sign * t.amount).toFixed(2), t.fee.toFixed(2), t.note || ''
    ]);
  });
  const csv = '\uFEFF' + lines.map(r => r.map(csvCell).join(',')).join('\r\n');
  download('交易流水_' + today().replace(/-/g, '') + '.csv', csv, 'text/csv;charset=utf-8');

}

function normalizeImport(data) {
  const idMap = {};
  const holdings = data.holdings.map((h, i) => {
    const nid = h.id || uid();
    idMap[h.id] = nid;
    return {
      id: nid,
      code: String(h.code || ''),
      name: String(h.name || ''),
      type: h.type === 'fund' ? 'fund' : 'etf',
      shares: Number(h.shares) || 0,
      avgCost: Number(h.avgCost) || 0,
      currentPrice: Number(h.currentPrice) || 0,
      prevClose: Number(h.prevClose) || 0,
      todayOpen: Number(h.todayOpen) || 0,
      lastUpdate: String(h.lastUpdate || ''),
      cleared: !!h.cleared,
      order: Number(h.order) || i + 1
    };
  });
  const transactions = (data.transactions || []).map(t => ({
    id: t.id || uid(),
    holdingId: idMap[t.holdingId] || '',
    type: t.type === 'sell' ? 'sell' : 'buy',
    shares: Number(t.shares) || 0,
    price: Number(t.price) || 0,
    amount: Number(t.amount) || 0,
    fee: Number(t.fee) || 0,
    date: String(t.date || ''),
    note: String(t.note || ''),
    clearance: !!t.clearance
  }));
  const plans = (Array.isArray(data.plans) ? data.plans : []).map(pl => {
    const w = {};
    Object.keys(pl.weights || {}).forEach(k => { w[idMap[k] || k] = Number(pl.weights[k]) || 0; });
    return {
      id: pl.id || uid(),
      name: String(pl.name || ''),
      startDate: String(pl.startDate || ''),
      endDate: String(pl.endDate || ''),
      totalTarget: Number(pl.totalTarget) || 0,
      driftThreshold: Number(pl.driftThreshold) > 0 ? Number(pl.driftThreshold) : 5,
      weights: w
    };
  });
  const activePlanId = data.activePlanId ? (idMap[data.activePlanId] || null) : null;
  const norm = { holdings, transactions, plans, activePlanId, monitoring: (data.monitoring && typeof data.monitoring === 'object' && !Array.isArray(data.monitoring)) ? data.monitoring : {}, settings: (data.settings && typeof data.settings === 'object') ? data.settings : {} };
  normalizeSettings(norm);
  reorderLegacySeed(norm);
  migrateFund(norm);
  return norm;
}

function renderPlan() {
  const sec = el('planSection');
  const plan = getActivePlan();
  if (!plan) {
    sec.innerHTML = '<div class="empty" style="padding:26px 0;margin-bottom:18px">尚未配置定投计划　<button class="btn primary" data-goplan>去配置</button></div>';
    return;
  }
  const tp = timeProgress(plan);
  const parts = sortedHoldings().filter(h => (plan.weights[h.id] || 0) > 0 && h.type !== 'fund');
  let cards = '', totalGap = 0;
  parts.forEach(h => {
    const w = plan.weights[h.id] || 0;
    const targetAbs = plan.totalTarget * w / 100;
    const cost = (h.avgCost || 0) * (h.shares || 0);
    const should = targetAbs * tp;
    const gap = should - cost;
    if (gap > 0) totalGap += gap;
    const r = posPL(h);
    const fillPct = targetAbs > 0 ? Math.min(100, Math.max(0, cost / targetAbs * 100)) : 0;
    const markPct = targetAbs > 0 ? Math.min(100, Math.max(0, should / targetAbs * 100)) : 0;
    let gapHtml;
    if (gap > 0.005) gapHtml = '<div class="pc-gap lag">还需买入 ¥' + fmtMoney(gap) + '</div>';
    else if (gap < -0.005) gapHtml = '<div class="pc-gap ahead">已多投 ¥' + fmtMoney(-gap) + '</div>';
    else gapHtml = '<div class="pc-gap ahead">已达标</div>';
    let lagBar = '';
    if (gap > 0.005 && markPct > fillPct) {
      lagBar = '<div class="pbar-lag" style="left:' + fillPct.toFixed(2) + '%;width:' + (markPct - fillPct).toFixed(2) + '%"></div>';
    }
    cards += '<div class="plan-card">' +
      '<div class="pc-head"><span class="code num">' + esc(h.code) + '</span><span>' + esc(h.name) + '</span>' + (h.cleared ? '<span class="badge-cleared">已清仓</span>' : '') + '</div>' +
      '<div class="pc-pl num' + (r === null ? '' : ' ' + cls(r.pl)) + '">' + (r === null ? '--' : fmtSigned(r.pl) + ' (' + fmtPct(r.pct === null ? 0 : r.pct) + ')') + '</div>' +
      gapHtml +
      '<div class="pbar"><div class="pbar-fill" style="width:' + fillPct.toFixed(2) + '%"></div>' + lagBar + '<div class="pbar-marker" style="left:calc(' + markPct.toFixed(2) + '% - 1px)"></div></div>' +
    '</div>';
  });
  sec.innerHTML =
    '<div class="plan-head">' +
      '<span class="ph-total">定投进度</span>' +
      '<span class="muted">' + esc(plan.name) + '(' + shortMonth(plan.startDate) + '→' + shortMonth(plan.endDate) + ') · 目标¥' + fmtMoney(plan.totalTarget) + ' · 时间进度' + (tp * 100).toFixed(0) + '%</span>' +
      '<span class="ph-total num">本月还需投入合计 ¥' + fmtMoney(totalGap) + '</span>' +
      '<div class="grow"></div>' +
      '<button class="btn" data-goplan>⚙ 配置</button>' +
    '</div>' +
    '<div class="plan-cards">' + (cards || '') + '</div>';
}

function renderAlloc() {
  const box = el('allocContent');
  const plan = getActivePlan();
  if (!plan) {
    box.innerHTML = '<div class="empty">尚未配置定投计划，无法进行资产配置分析。<br>可在「当前持仓」页上方的定投进度区域点击 [⚙ 配置] 创建。</div>';
    return;
  }
  const totalMV = totalMarketValue();
  const thr = plan.driftThreshold > 0 ? plan.driftThreshold : 5;
  const parts = sortedHoldings().filter(h => (plan.weights[h.id] || 0) > 0);
  let maxVal = 40;
  const rows = parts.map(h => {
    const w = plan.weights[h.id] || 0;
    const mv = marketValue(h);
    const actual = totalMV > 0 ? mv / totalMV * 100 : 0;
    const dev = actual - w;
    const amt = totalMV > 0 ? dev / 100 * totalMV : 0;
    maxVal = Math.max(maxVal, w, actual);
    return { h, w, mv, actual, dev, amt };
  }).sort((a, b) => Math.abs(b.dev) - Math.abs(a.dev));
  const overCount = rows.filter(r => Math.abs(r.dev) > thr).length;
  const worst = rows.length ? rows[0] : null;
  const scaleMax = maxVal * 1.08;
  const listHtml = rows.map(r => {
    const isOver = Math.abs(r.dev) > thr;
    const tag = isOver ? '<span class="tag-warn">' + (r.dev > 0 ? '减仓' : '补仓') + '</span>' : '';
    const actTxt = isOver ? (r.dev > 0 ? '减仓约 ¥' : '补仓约 ¥') + fmtMoney(Math.abs(r.amt)) : '';
    return '<div class="alloc-row' + (isOver ? ' over' : '') + '">' +
      '<div class="alloc-name"><span class="code num">' + esc(r.h.code) + '</span><span>' + esc(r.h.name) + '</span>' + (r.h.cleared ? '<span class="badge-cleared">已清仓</span>' : '') + tag + '</div>' +
      '<div class="alloc-bars">' +
        '<div class="alloc-line"><span class="lbl">目标 ' + r.w.toFixed(1) + '%</span><div class="abar"><div class="abar-t" style="width:' + (r.w / scaleMax * 100).toFixed(2) + '%"></div></div></div>' +
        '<div class="alloc-line"><span class="lbl">实际 ' + r.actual.toFixed(1) + '%</span><div class="abar"><div class="abar-a" style="width:' + (r.actual / scaleMax * 100).toFixed(2) + '%"></div></div></div>' +
      '</div>' +
      '<div class="alloc-nums num">偏离 <span class="' + cls(r.dev) + '">' + fmtPct(r.dev / 100) + '</span>' + (actTxt ? ' · ' + actTxt : '') + '</div>' +
    '</div>';
  }).join('');
  box.innerHTML =
    '<div class="alloc-summary">' +
      '<span>总市值 <b class="num" style="color:var(--text)">¥' + fmtMoney(totalMV) + '</b></span>' +
      (worst ? '<span>最大偏离：<b style="color:var(--text)">' + esc(worst.h.name) + ' ' + fmtPct(worst.dev / 100) + '</b></span>' : '') +
      '<span>超阈值标的：<b style="color:var(--text)">' + overCount + '</b> 只（阈值 ±' + thr + 'pp）</span>' +
    '</div>' +
    '<div class="alloc-list">' + (listHtml || '<div class="empty">暂无参与计划的标的</div>') + '</div>';
}

/* ===================== 定投参考（v0.9.0 · V4里程碑） =====================
   配置驱动声明式规则引擎：新增标的只需扩展 MONITOR_CONFIGS + Edge Function 注册表
   数据流：monitor_data 表(Supabase) --读--> state.monitoring 缓存 --> 前端判定
          卡片[刷新] --> Edge Function fetch-monitor 现场抓取 --> upsert 表 + 更新缓存
   ======================================================================== */

const MONITOR_TABLE = 'monitor_data';

function op(type, key, arg) { return { type, key, arg }; }
function evalCond(c, v) {
  const x = v[c.key];
  if (!Number.isFinite(x)) return false;
  switch (c.type) {
    case 'gt': return x > c.arg;
    case 'ge': return x >= c.arg;
    case 'lt': return x < c.arg;
    case 'le': return x <= c.arg;
    case 'between': return x >= c.arg[0] && x < c.arg[1];
    default: return false;
  }
}
function evalNode(node, v) {
  if (!node) return false;
  if (Array.isArray(node.all)) return node.all.every(c => evalCond(c, v));
  if (Array.isArray(node.any)) return node.any.some(c => evalCond(c, v));
  return evalCond(node, v);
}

function evaluateMonitor(code) {
  const cfg = MONITOR_CONFIGS[code];
  if (!cfg) return null;
  const snap = (state.monitoring || {})[code];
  const v = {}, missing = [];
  cfg.indicators.forEach(ind => {
    const x = snap && snap.values ? snap.values[ind.key] : undefined;
    if (Number.isFinite(x)) v[ind.key] = x; else missing.push(ind.label);
  });
  (cfg.derived || []).forEach(d => {
    if (d.needs.every(k => Number.isFinite(v[k]))) v[d.key] = d.formula(v);
    else missing.push(d.label);
  });
  if (missing.length) {
    return { level: 'incomplete', mult: null, missing,
      reasons: ['缺少指标：' + missing.join('、') + '，数据不全无法判定'] };
  }
  const reasons = [];
  let lvl = null, hitReason = '';
  for (const r of cfg.rules) {
    if (evalNode(r.when, v)) { lvl = r.level; hitReason = r.reason; break; }
  }
  if (!lvl) { lvl = cfg.defaultLevel; hitReason = cfg.defaultReason; }
  for (const vt of (cfg.veto || [])) {
    if (vt.caps.includes(lvl) && evalNode(vt.when, v)) {
      reasons.push('⚠ 否决：' + vt.reason);
      lvl = vt.capTo;
    }
  }
  reasons.unshift(hitReason);
  return { level: lvl, mult: cfg.levels[lvl].mult, missing: [], reasons };
}

function parseMonDate(s) {
  if (!s) return NaN;
  s = String(s);
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]).getTime();
  m = /^(\d{2})-(\d{2})/.exec(s);
  if (m) {
    const y = new Date().getFullYear();
    let t = new Date(y, +m[1] - 1, +m[2]).getTime();
    if (t > Date.now() + 7 * 86400000) t -= 365 * 86400000;
    return t;
  }
  return NaN;
}
function monRowHtml(cfg, ind, snap) {
  const x = snap && snap.values ? snap.values[ind.key] : undefined;
  const has = Number.isFinite(x);
  const rawDate = (snap && snap.dates && snap.dates[ind.key]) ||
    (snap && snap.fetchedAt ? String(snap.fetchedAt).slice(5, 10) : '');
  const stale = has && snap && monIsStale(snap, ind);
  return '<tr><td>' + esc(ind.label) + '</td>' +
    '<td class="val num' + (stale ? ' stale' : '') + '">' + (has ? x.toFixed(ind.digits) + ind.unit : '—') + '</td>' +
    '<td class="asof">' + esc(rawDate) + '</td></tr>';
}
function monIsStale(snap, ind) {
  const t = parseMonDate((snap.dates && snap.dates[ind.key]) || snap.fetchedAt);
  return Number.isFinite(t) && (Date.now() - t) > ind.staleDays * 86400000;
}
function monCardHtml(code) {
  const cfg = MONITOR_CONFIGS[code];
  const snap = (state.monitoring || {})[code];
  let body;
  if (!snap || !Object.keys(snap.values || {}).length) {
    body = '<div class="mon-verdict"><span class="lv-badge lv-gray">无数据</span>' +
      '<span class="mult-note">点击右上角 [刷新] 拉取监测数据</span></div>';
  } else {
    const ev = evaluateMonitor(code);
    const lv = cfg.levels[ev.level] || cfg.levels.incomplete;
    body = '<div class="mon-verdict">' +
      '<span class="lv-badge ' + lv.cls + '">' + esc(lv.label) + '</span>' +
      '<span class="mult-note">' + (ev.mult === null ? '—' : '本月定投 ' + ev.mult + ' 倍金额') + '</span></div>';
    const rows = cfg.indicators.map(i => monRowHtml(cfg, i, snap)).join('');
    const dRows = (cfg.derived || []).map(d => {
      const x = evaluateMonitorDerivedVal(d, code);
      return '<tr><td>' + esc(d.label) + '</td><td class="val num">' +
        (Number.isFinite(x) ? x.toFixed(d.digits) + d.unit : '—') + '</td><td class="asof">自动计算</td></tr>';
    }).join('');
    body += '<table class="mon-table">' + rows + dRows + '</table>';
    if (ev.reasons.length) {
      body += '<div class="mon-reason">判定依据：' + ev.reasons.map(esc).join('<br>') + '</div>';
    }
  }
  return '<div class="mon-card" data-code="' + esc(code) + '">' +
    '<div class="mon-head"><span class="mon-title">' + esc(cfg.name) +
    '<span class="muted num">' + esc(code) + '</span></span>' +
    '<div class="grow"></div>' +
    '<button class="btn ghost" data-act="refreshMon" data-code="' + esc(code) + '">⟳ 刷新</button></div>' +
    body + '</div>';
}
function evaluateMonitorDerivedVal(d, code) {
  const snap = (state.monitoring || {})[code];
  const v = {};
  d.needs.forEach(k => { v[k] = snap && snap.values ? snap.values[k] : undefined; });
  return d.needs.every(k => Number.isFinite(v[k])) ? d.formula(v) : NaN;
}
function renderMonitorSrcNote() {
  const notes = [];
  Object.values(MONITOR_CONFIGS).forEach(c => { (c.srcNotes || []).forEach(n => notes.push(n)); });
  const box = el('monitorSrcNote');
  if (box) box.innerHTML = '数据口径说明 — ' + notes.map(esc).join('；') +
    '。数字旁为来源日期，灰色表示超过时效阈值（见配置），仅提示不警告。';
}
function renderMonitor() {
  const list = el('monitorList');
  if (!list) return;
  if (!sb) {
    list.innerHTML = '<div class="mon-empty">云端未连接：登录云同步并部署监测服务后，「定投参考」可用。<br>详见项目目录 supabase-monitor/03_部署指引.md</div>';
    renderMonitorSrcNote();
    return;
  }
  list.innerHTML = Object.keys(MONITOR_CONFIGS).map(monCardHtml).join('');
  renderMonitorSrcNote();
}
let monitorLoaded = false;
async function lazyLoadMonitor() {
  renderMonitor();
  if (monitorLoaded || !sb) return;
  monitorLoaded = true;
  await loadMonitorData();
  renderMonitor();
}
async function loadMonitorData() {
  try {
    const { data, error } = await sb.from(MONITOR_TABLE).select('id,payload,meta,fetched_at');
    if (error) throw error;
    (data || []).forEach(r => {
      state.monitoring[r.id] = {
        values: r.payload || {},
        dates: (r.meta && typeof r.meta === 'object') ? (r.meta.dates || {}) : {},
        fetchedAt: r.fetched_at || ''
      };
    });
  } catch (e) {
    console.warn('monitor_data 读取失败:', e);
  }
}
const monRefreshing = {};
async function refreshMonitor(code, btn) {
  if (!sb) { toast('云端未连接'); return; }
  if (monRefreshing[code]) return;
  monRefreshing[code] = true;
  const oldHtml = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.textContent = '刷新中…'; }
  try {
    const { data, error } = await sb.functions.invoke('fetch-monitor', {
      headers: { 'x-mon-secret': MONITOR_SECRET },
      body: { symbols: [code] }
    });
    if (error) throw error;
    const r = data && Array.isArray(data.results) ? data.results[0] : null;
    if (!r || !r.ok) throw new Error((r && r.errors && r.errors.join(';')) || '抓取失败');
    state.monitoring[code] = {
      values: r.values || {},
      dates: (r.meta && typeof r.meta === 'object') ? (r.meta.dates || {}) : {},
      fetchedAt: data.fetchedAt || new Date().toISOString()
    };
    save();
    toast(code + ' 监测数据已更新');
  } catch (e) {
    const msg = String(e.message || e);
    toast(msg.includes('unauthorized') ? '刷新失败：MONITOR_SECRET 校验不过' : '刷新失败：' + msg);
  } finally {
    delete monRefreshing[code];
    if (btn) { btn.disabled = false; btn.innerHTML = oldHtml || '⟳ 刷新'; }
    renderMonitor();
  }
}
/* =================== 定投参考 END =================== */

function bindEvents() {
  document.addEventListener('click', e => {
    const t = e.target;
    if (t && t.tagName === 'INPUT' && t.type === 'date' && typeof t.showPicker === 'function') {
      try { t.showPicker(); } catch (err) {}
    }
  });

  el('planSection').addEventListener('click', e => {
    if (e.target.closest('[data-goplan]')) openPlanConfigModal();
  });

  document.querySelectorAll('.tab').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
      document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.dataset.view === b.dataset.tab));
      if (b.dataset.tab === 'monitor') lazyLoadMonitor();
    };
  });

  el('monitorList').addEventListener('click', e => {
    const btn = e.target.closest('[data-act="refreshMon"]');
    if (!btn) return;
    refreshMonitor(btn.dataset.code, btn);
  });
  el('btnMonRefreshAll').onclick = async function () {
    for (const code of Object.keys(MONITOR_CONFIGS)) {
      await refreshMonitor(code, null);
    }
  };

  el('holdingList').addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const card = e.target.closest('.holding[data-id]');
    if (!card) return;
    openTradeOrAction(card.dataset.id, btn.dataset.act);
  });

  el('txBody').addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del) deleteTx(del.dataset.del);
    const edit = e.target.closest('[data-edit]');
    if (edit) openEditTxModal(edit.dataset.edit);
  });

  initDragSort();
  initTouchDragSort();
  if (mqMobile.addEventListener) mqMobile.addEventListener('change', renderAll);
  else if (mqMobile.addListener) mqMobile.addListener(renderAll);

  el('btnRefresh').onclick = openRefreshModal;
  el('btnNewHolding').onclick = openNewHoldingModal;
  el('btnQuote').onclick = () => fetchQuotes(false);
  const qSel = el('quoteAuto');
  if (state && state.settings) qSel.value = String(state.settings.quoteAutoSec);
  qSel.onchange = e => {
    state.settings.quoteAutoSec = Number(e.target.value) || 0;
    save();
    setQuoteTimer();
    toast(Number(e.target.value) > 0 ? '已开启交易时段自动刷新' : '已关闭自动刷新');
  };
  el('btnExportCsv').onclick = exportCsv;
  el('btnExportJson').onclick = exportJson;
  el('btnImportJson').onclick = () => el('importFile').click();
  el('importFile').onchange = e => {
    importJson(e.target.files[0]);
    e.target.value = '';
  };

  if (sb) {
    el('btnLogin').onclick = doLogin;
    el('loginPw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    el('btnLogout').onclick = async () => {
      const ok = await confirmDialog(
        '退出后，本设备的改动将只保存在本地，直到重新登录才会同步。确定退出？',
        { title: '退出云端登录', okText: '退出登录', danger: true }
      );
      if (!ok) return;
      try { await sb.auth.signOut(); } catch (e) {}
      location.reload();
    };
  }

  el('sortDate').onclick = () => {
    if (txSort.key === 'date') txSort.dir *= -1; else txSort = { key: 'date', dir: -1 };
    renderTransactions();
  };
  el('sortCode').onclick = () => {
    if (txSort.key === 'code') txSort.dir *= -1; else txSort = { key: 'code', dir: 1 };
    renderTransactions();
  };
  el('txFilter').onchange = e => { txFilterCode = e.target.value; renderTransactions(); };
}

function openTradeOrAction(id, act) {
  const h = getHolding(id);
  if (!h) return;
  if (act === 'buy' || act === 'sell') {
    if (h.type === 'fund') { toast('场外基金不支持买入/卖出，请使用「更新」录入'); return; }
    openTradeModal(id, act);
  } else if (act === 'update') {
    openUpdateFundModal(id);
  } else if (act === 'edit') {
    if (h.type === 'fund') openEditFundModal(id);
    else openEditModal(id);
  }
}

bindEvents();

function showCorruptDialogIfAny() {
  if (!corruptBackup) return;
  const ov = openModal({
    title: '数据异常提醒',
    body: '<div class="confirm-msg">本地存档数据损坏，无法正常读取。<br>已载入初始示例标的，损坏的旧数据已自动备份在浏览器中。<br>' +
      '<span class="muted">如果之前导出过 JSON 备份，请用右上角「导入恢复」找回数据。</span></div>',
    foot: '<button class="btn primary" data-ok>知道了</button>'
  });
  ov.querySelector('[data-ok]').onclick = ov.close;
}
function localBoot() {
  state = loadState();
  save();
  syncQuoteSel();
  renderAll();
  setQuoteTimer();
  fetchQuotes(true);
  showCorruptDialogIfAny();
}
async function startCloudSession() {
  const boot = el('bootOverlay');
  if (boot) boot.style.display = 'flex';
  try {
    const { data: rows, error } = await sb.from(SUPABASE_TABLE).select('data,revision').eq('id', 1).limit(1);
    if (error) throw error;
    const row = (rows && rows[0]) || null;
    sessionReady = true;
    el('btnLogout').style.display = '';
    const emptyCloud = !row || !row.data || !Array.isArray(row.data.holdings);
    state = loadState();
    syncQuoteSel();
    if (emptyCloud) {
      syncMeta.baseRevision = row ? (Number(row.revision) || 0) : 0;
      if (!row) {
        const ins = await sb.from(SUPABASE_TABLE)
          .insert({ id: 1, data: {}, revision: 1, updated_at: new Date().toISOString() });
        if (ins.error) throw ins.error;
        syncMeta.baseRevision = 1;
      }
      syncMeta.dirty = true;
      saveSyncMeta();
      renderAll();
      await forcePush();
    } else if (Number(row.revision) > syncMeta.baseRevision) {
      if (syncMeta.dirty) {
        renderAll();
        conflictDialog({ revision: Number(row.revision), data: row.data });
      } else if (!adoptRemote({ revision: Number(row.revision), data: row.data })) {
        toast('云端数据异常，已使用本地缓存');
        renderAll();
      }
    } else {
      if (Number(row.revision) < syncMeta.baseRevision) {
        syncMeta.baseRevision = Number(row.revision);
        saveSyncMeta();
      }
      renderAll();
      if (syncMeta.dirty) flushCloudPush();
    }
    setQuoteTimer();
    fetchQuotes(true);
    showCorruptDialogIfAny();
  } catch (e) {
    sessionReady = true;
    el('btnLogout').style.display = '';
    state = loadState();
    syncQuoteSel();
    renderAll();
    setQuoteTimer();
    fetchQuotes(true);
    setSyncDot('err', '云端暂不可达，当前使用本地缓存');
    toast('云端暂不可达，当前使用本地缓存');
    showCorruptDialogIfAny();
  } finally {
    if (boot) boot.style.display = 'none';
  }
}
async function doLogin() {
  const email = el('loginEmail').value.trim(), pw = el('loginPw').value;
  const errEl = el('loginErr');
  errEl.textContent = '';
  if (!email || !pw) { errEl.textContent = '请输入邮箱和密码'; return; }
  el('btnLogin').disabled = true;
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) { errEl.textContent = '登录失败：' + (error.message || ''); return; }
    el('loginOverlay').style.display = 'none';
    await startCloudSession();
  } catch (e) {
    errEl.textContent = '登录失败：网络异常';
  } finally {
    el('btnLogin').disabled = false;
  }
}

(async function boot() {
  if (!sb) {
    setSyncDot('', '本地模式（未配置云端）');
    localBoot();
    return;
  }
  let hasSession = false;
  try {
    const res = await sb.auth.getSession();
    hasSession = !!(res && res.data && res.data.session);
  } catch (e) { hasSession = false; }
  if (!hasSession) {
    setSyncDot('', '未登录云端');
    localBoot();
    el('loginOverlay').style.display = 'flex';
    return;
  }
  await startCloudSession();
})();

if (window.addEventListener) window.addEventListener('online', () => { if (syncMeta.dirty) flushCloudPush(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && typeof pullIfNewer === 'function') pullIfNewer(); });
</script>
